    <script>
      // Suppress benign Vite HMR & WebSocket runner disconnect errors in dev iframe
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        var file = (e && e.filename) ? e.filename : '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport') || file.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e ? (e.reason && e.reason.message ? e.reason.message : String(e.reason || '')) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
